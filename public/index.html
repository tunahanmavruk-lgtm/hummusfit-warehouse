<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Hummus Fit Warehouse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#2BBFAA; --orange:#E8612C;
    --ink:#111417; --dim:#767c85; --line:#e9ebee; --bg:#fafafa;
    --bakery:var(--teal); --meals:#1a1f2b; --green:#2BBFAA; --red:#E8612C;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  header{background:#fff;border-bottom:1px solid var(--line);color:var(--ink);padding:18px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
  header h1{font-size:17px;margin:0;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;}
  header h1 .brandmark{height:28px;width:auto;display:block;}
  .section-title .buffinmark{height:20px;width:auto;display:block;margin-left:2px;}
  nav{display:flex;gap:8px;}
  nav button{background:transparent;border:1.5px solid var(--line);color:var(--dim);padding:11px 20px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.01em;}
  nav button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  main{padding:20px;max-width:1200px;margin:0 auto;}
  .view{display:none;}
  .view.active{display:block;}

  .section-block{margin-bottom:32px;}
  .section-title{font-size:13px;font-weight:800;margin:0 0 14px;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);}
  .section-title .swatch{width:9px;height:9px;border-radius:50%;}
  .rowgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:20px;}
  .lane{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;transition:border-color .1s;}
  .lane.empty{border-style:dashed;color:var(--dim);}
  .lane.low{border-color:var(--orange);background:#fff8f5;}
  .lane .code{font-size:11px;font-weight:800;color:var(--dim);letter-spacing:.03em;}
  .lane .pname{font-size:13.5px;font-weight:700;line-height:1.3;margin:6px 0;color:var(--ink);}
  .lane .crates{font-size:12px;font-weight:700;color:var(--teal);}
  .lane .crates.low{color:var(--orange);}

  .panel{position:fixed;inset:0;background:rgba(17,20,23,.45);display:none;align-items:flex-end;justify-content:center;z-index:100;}
  .panel.open{display:flex;}
  .sheet{background:#fff;width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:24px;max-height:85vh;overflow-y:auto;}
  .sheet h2{margin:0 0 4px;font-size:20px;font-weight:800;}
  .sheet .sub{color:var(--dim);font-size:13px;margin:0 0 18px;font-weight:600;}
  .sheet label{display:block;font-size:12px;font-weight:800;margin:16px 0 8px;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);}
  .sheet select, .sheet input{width:100%;padding:13px;font-size:16px;border:1.5px solid var(--line);border-radius:12px;font-family:inherit;background:#fafafa;}
  .btnrow{display:flex;gap:10px;margin-top:20px;}
  .btn{flex:1;padding:15px;border-radius:12px;border:none;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;}
  .btn.primary{background:var(--teal);color:#fff;}
  .btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink);}
  .btn.danger{background:#fff;border:1.5px solid var(--orange);color:var(--orange);}
  .stockbtns{display:flex;gap:8px;flex-wrap:wrap;}
  .stockbtns button{flex:1;min-width:64px;padding:16px 8px;border-radius:12px;border:1.5px solid var(--line);background:#fafafa;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit;}
  .stockbtns button.minus{color:var(--orange);border-color:var(--orange);background:#fff;}
  .stockbtns button.plus{color:var(--teal);border-color:var(--teal);background:#fff;}

  .lowlist{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:4px;}
  .lowrow{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-size:14px;}
  .lowrow:last-child{border-bottom:none;}
  .lowrow .code{font-weight:800;color:var(--dim);width:70px;flex:none;}
  .lowrow .name{flex:1;font-weight:700;}
  .lowrow .badge{background:var(--orange);color:#fff;font-size:11px;font-weight:800;padding:5px 10px;border-radius:20px;}
  .empty-msg{text-align:center;color:var(--dim);padding:48px 0;font-size:14px;font-weight:600;}

  .loglist{background:#fff;border:1.5px solid var(--line);border-radius:14px;}
  .logrow{padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px;display:flex;justify-content:space-between;color:var(--dim);font-weight:600;}
  .logrow:last-child{border-bottom:none;}
  .logrow b{color:var(--ink);}
</style>
</head>
<body>
<header>
  <h1><img src="/assets/hummusfit-logo.png" alt="Hummus Fit" class="brandmark"></h1>
  <nav>
    <button class="active" data-view="floor">Floor Plan</button>
    <button data-view="restock">Restock</button>
  </nav>
</header>

<main>
  <div class="view active" id="view-floor"></div>
  <div class="view" id="view-restock"></div>
</main>

<div class="panel" id="panel">
  <div class="sheet" id="sheet"></div>
</div>

<script>
let lanes = [];
let products = [];
let currentLaneId = null;

async function loadAll(){
  const [laneRes, prodRes] = await Promise.all([
    fetch('/api/lanes').then(r=>r.json()),
    fetch('/api/products').then(r=>r.json())
  ]);
  lanes = laneRes; products = prodRes;
  renderFloor();
  renderRestock();
}

function laneIsLow(l){
  return l.product_id && l.crates_current <= 1;
}

function renderFloor(){
  const el = document.getElementById('view-floor');
  const sections = [
    {key:'bakery', label:'Bakery & Snacks', color:'var(--teal)'},
    {key:'meals', label:'Meals', color:'var(--ink)'}
  ];
  el.innerHTML = sections.map(s => {
    const rows = {};
    lanes.filter(l=>l.section===s.key).forEach(l=>{
      rows[l.row_num] = rows[l.row_num] || [];
      rows[l.row_num].push(l);
    });
    const rowHtml = Object.keys(rows).sort().map(rn => `
      <div class="rowgrid">
        ${rows[rn].map(laneCard).join('')}
      </div>
    `).join('');
    const buffinMark = s.key === 'bakery' ? `<img src="/assets/buffin-logo.png" alt="Buffin Bakery" class="buffinmark">` : '';
    return `
      <div class="section-block">
        <div class="section-title"><span class="swatch" style="background:${s.color}"></span>${s.label}${buffinMark}</div>
        ${rowHtml}
      </div>
    `;
  }).join('');

  el.querySelectorAll('.lane').forEach(card => {
    card.addEventListener('click', () => openAssignSheet(Number(card.dataset.id)));
  });
}

function laneCard(l){
  const low = laneIsLow(l);
  const cls = ['lane', l.product_id ? '' : 'empty', low ? 'low' : ''].join(' ').trim();
  return `
    <div class="${cls}" data-id="${l.id}">
      <div class="code">${l.code}</div>
      <div class="pname">${l.product_name ? l.product_name : '— empty —'}</div>
      ${l.product_id ? `<div class="crates ${low?'low':''}">${l.crates_current} / ${l.max_stack} crates${low?' ⚠ LOW':''}</div>` : ''}
    </div>
  `;
}

function openAssignSheet(laneId){
  currentLaneId = laneId;
  const lane = lanes.find(l=>l.id===laneId);
  const options = products
    .filter(p => (lane.section==='meals') ? p.category==='meal' : p.category!=='meal')
    .sort((a,b)=> b.u30 - a.u30)
    .map(p => `<option value="${p.id}" ${p.id===lane.product_id?'selected':''}>${p.name}</option>`).join('');

  document.getElementById('sheet').innerHTML = `
    <h2>${lane.code}</h2>
    <p class="sub">${lane.section === 'meals' ? 'Meals section' : 'Bakery & Snacks section'}</p>
    <label>Assigned product</label>
    <select id="assignSelect">
      <option value="">— leave empty —</option>
      ${options}
    </select>
    <label>Max stack (crates high)</label>
    <input type="number" id="maxStackInput" value="${lane.max_stack || 5}" min="1" max="5">
    <div class="btnrow">
      <button class="btn ghost" onclick="closePanel()">Cancel</button>
      <button class="btn primary" onclick="saveAssign()">Save</button>
    </div>
  `;
  document.getElementById('panel').classList.add('open');
}

async function saveAssign(){
  const select = document.getElementById('assignSelect');
  const maxStack = Number(document.getElementById('maxStackInput').value) || 5;
  const productId = select.value ? Number(select.value) : null;
  await fetch(`/api/lanes/${currentLaneId}/assign`, {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({product_id: productId, max_stack: maxStack})
  });
  closePanel();
  loadAll();
}

function closePanel(){
  document.getElementById('panel').classList.remove('open');
  currentLaneId = null;
}

// ---------- Restock view ----------
function renderRestock(){
  const el = document.getElementById('view-restock');
  const low = lanes.filter(laneIsLow);
  const active = lanes.filter(l => l.product_id);

  el.innerHTML = `
    <div class="section-block">
      <div class="section-title">Needs Restock — ${low.length}</div>
      ${low.length ? `<div class="lowlist">${low.map(l=>`
        <div class="lowrow">
          <div class="code">${l.code}</div>
          <div class="name">${l.product_name}</div>
          <div class="badge">${l.crates_current} left</div>
        </div>
      `).join('')}</div>` : `<div class="empty-msg">Nothing low right now</div>`}
    </div>
    <div class="section-block">
      <div class="section-title">All Lanes — Tap to Restock</div>
      <div class="rowgrid">
        ${active.map(laneCard).join('')}
      </div>
    </div>
    <div class="section-block">
      <div class="section-title">Recent Activity</div>
      <div class="loglist" id="logfeed">Loading…</div>
    </div>
  `;

  el.querySelectorAll('.lane').forEach(card => {
    card.addEventListener('click', () => openRestockSheet(Number(card.dataset.id)));
  });

  loadLog();
}

async function loadLog(){
  const rows = await fetch('/api/restock-log').then(r=>r.json());
  const feed = document.getElementById('logfeed');
  if (!feed) return;
  if (!rows.length) { feed.innerHTML = `<div class="empty-msg">No restock activity yet.</div>`; return; }
  feed.innerHTML = rows.slice(0,20).map(r => `
    <div class="logrow">
      <span><b>${r.lane_code}</b> · ${r.product_name || ''}</span>
      <span>${r.crates_added > 0 ? '+' : ''}${r.crates_added} crate(s) · ${new Date(r.ts).toLocaleString()}</span>
    </div>
  `).join('');
}

function openRestockSheet(laneId){
  currentLaneId = laneId;
  const lane = lanes.find(l=>l.id===laneId);
  if (!lane.product_id) return openAssignSheet(laneId);

  document.getElementById('sheet').innerHTML = `
    <h2>${lane.code}</h2>
    <p class="sub">${lane.product_name} — currently ${lane.crates_current} / ${lane.max_stack} crates</p>
    <label>Adjust crate count</label>
    <div class="stockbtns">
      <button class="minus" onclick="adjustStock(-1)">-1</button>
      <button class="plus" onclick="adjustStock(1)">+1</button>
      <button class="plus" onclick="adjustStock(5)">+5</button>
    </div>
    <div class="btnrow">
      <button class="btn ghost" onclick="closePanel()">Close</button>
      <button class="btn danger" onclick="adjustStock(-lane.crates_current)">Set to 0</button>
    </div>
  `;
  document.getElementById('panel').classList.add('open');
}

async function adjustStock(delta){
  await fetch(`/api/lanes/${currentLaneId}/restock`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({crates_added: delta})
  });
  closePanel();
  loadAll();
}

document.querySelectorAll('nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('view-'+btn.dataset.view).classList.add('active');
  });
});

document.getElementById('panel').addEventListener('click', (e) => {
  if (e.target.id === 'panel') closePanel();
});

loadAll();
setInterval(loadAll, 15000); // kiosk auto-refresh so multiple people on one tablet stay in sync
</script>
</body>
</html>
